on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/portfoli-app:latest .

      - name: push image to registry
        run: docker push ${{ secrets.DOCKER_USERNAME }}/portfoli-app:latest